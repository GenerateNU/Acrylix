CONFIG_GPIO=y
CONFIG_BOOT_DELAY=500
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_PWM=y

# Console: RTT over SWD (no UART needed)

# RTT Console
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Logging via RTT
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PROCESS_THREAD=y

# Shell over RTT (Optional)
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_BUFFER=0

# ── Stack sizes ────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_LV_Z_FLUSH_THREAD=n
# Use static buffer allocation — avoids heap allocation during init
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y

# Set bits per pixel explicitly for static buffer size calculation
CONFIG_LV_Z_BITS_PER_PIXEL=16


# ── Memory ─────────────────────────────────────────────────────
# Heap covers k_malloc, LVGL fallback allocs, and Zephyr drivers.
# 32KB is safer with two threads and LVGL running simultaneously.
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ILI9340=y
CONFIG_MIPI_DBI=y

# ── LVGL ───────────────────────────────────────────────────────
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# Memory pool: 32KB gives LVGL enough room for your screen objects.
# If you see LVGL assert failures lower this and check for leaks.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Fonts — all used in display.c
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# Widgets used in display.c
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_ARC=y

CONFIG_FAULT_DUMP=2
CONFIG_MPU_STACK_GUARD=y

# ── Input subsystem ────────────────────────────────────────────
# Encoder and buttons are raw GPIO ISR — input subsystem only
# needed for its kernel infrastructure, not the qdec/keys drivers.
CONFIG_INPUT=y
# CONFIG_INPUT_GPIO_QDEC=y   — not used, encoder is raw GPIO ISR
# CONFIG_INPUT_GPIO_KEYS=y   — not used, buttons are raw GPIO ISR


# ── Disable unused LVGL widgets ────────────────────────────────
CONFIG_LV_USE_BTN=n
CONFIG_LV_USE_BTNMATRIX=n
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_CHECKBOX=n
CONFIG_LV_USE_DROPDOWN=n
CONFIG_LV_USE_IMG=n
CONFIG_LV_USE_ROLLER=n
CONFIG_LV_USE_SLIDER=n
CONFIG_LV_USE_SWITCH=n
CONFIG_LV_USE_TEXTAREA=n
CONFIG_LV_USE_TABLE=n
CONFIG_LV_USE_ANIMIMG=n
CONFIG_LV_USE_CALENDAR=n
CONFIG_LV_USE_CALENDAR_HEADER_ARROW=n
CONFIG_LV_USE_CALENDAR_HEADER_DROPDOWN=n
CONFIG_LV_USE_CHART=n
CONFIG_LV_USE_COLORWHEEL=n
CONFIG_LV_USE_IMGBTN=n
CONFIG_LV_USE_KEYBOARD=n
CONFIG_LV_USE_LED=n
CONFIG_LV_USE_LIST=n
CONFIG_LV_USE_MENU=n
CONFIG_LV_USE_METER=n
CONFIG_LV_USE_MSGBOX=n
CONFIG_LV_USE_SPAN=n
CONFIG_LV_USE_SPINBOX=n
CONFIG_LV_USE_SPINNER=n
CONFIG_LV_USE_TABVIEW=n
CONFIG_LV_USE_TILEVIEW=n
CONFIG_LV_USE_WIN=n
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_THEME_BASIC=n
CONFIG_LV_USE_SNAPSHOT=n

#debugging
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Peripherals (uncomment as each subsystem is implemented)
# CONFIG_I2C=y     # AS5600 absolute encoder
CONFIG_ADC=y       # PT1000 temperature sensing
# CONFIG_PWM=y     # SSR heater (TIM1_CH1, PA8)
