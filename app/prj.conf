# ── Smoke test config ──────────────────────────────────────────────────────────
# Display, encoder, LVGL, and SPI are commented out for the smoke test build.
# Confirm PB5 toggles at 0.5 Hz before re-enabling the sections below.
# ──────────────────────────────────────────────────────────────────────────────

# Console
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y

# GPIO (required for smoke test pin toggle)
CONFIG_GPIO=y

# Stack / heap
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ── Restore after smoke test confirms MCU is executing ────────────────────────

# SPI + display (Priority 2: also requires CONFIG_MIPI_DBI=y)
# CONFIG_SPI=y
# CONFIG_DISPLAY=y
# CONFIG_ILI9340=y
# CONFIG_MIPI_DBI=y          ← required for zephyr,mipi-dbi-spi DTS node to bind

# LVGL
# CONFIG_LVGL=y
# CONFIG_LV_COLOR_DEPTH_16=y
# CONFIG_LV_Z_MEM_POOL_SIZE=65536
# CONFIG_LV_USE_LABEL=y
# CONFIG_LV_USE_BAR=y

# Rotary encoder
# CONFIG_INPUT=y
# CONFIG_INPUT_GPIO_QDEC=y

# Peripherals (uncomment as each subsystem is implemented)
# CONFIG_I2C=y     # AS5600 absolute encoder
# CONFIG_ADC=y     # PT1000 temperature sensing
# CONFIG_PWM=y     # SSR heater (TIM1_CH1, PA8)
