#Zephyr Version: 3.7.0
# Smoke test config — bare minimum to confirm MCU is running
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=8192

# Keep debug interface alive during sleep (development only)
CONFIG_PM=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# SPI + display
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ILI9340=y
CONFIG_MIPI_DBI=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_Z_VDB_SIZE=5
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_USE_LABEL=y
#CONFIG_LV_USE_BTN=y
#CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_COLOR_16_SWAP=y

# Rotary encoder + buttons
CONFIG_INPUT=y
#CONFIG_INPUT_GPIO_QDEC=y
#CONFIG_INPUT_GPIO_KEYS=y
