# this was set for the esp32 for some reason, I forget, something to do with memory jumps?
# CONFIG_COMPILER_OPT="-mlongcalls"
# Console output - RTT over SWD
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

# GPIO driver
CONFIG_GPIO=y

#SPI for display
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ILI9340=y

#LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_VDB_SIZE=5
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y

#Rotary encoder
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_QDEC=y

#motor
CONFIG_SERIAL=y
CONFIG_PRINTK=y

#LVGL widgets
CONFIG_LV_USE_LABEL=y
#CONFIG_LV_USE_BTN=y
#CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_BAR=y


# Uncomment these as you need them:
# CONFIG_I2C=y
# CONFIG_PWM=y
# CONFIG_ADC=y