# this was set for the esp32 for some reason, I forget, something to do with memory jumps?
# CONFIG_COMPILER_OPT="-mlongcalls"
# Console output
CONFIG_UART_CONSOLE=y

# GPIO driver
CONFIG_GPIO=y

#SPI for display
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ILI9340=y

#LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_MEM_SIZE_KILOBYTES=64
#Rotary encoder
CONFIG_INPUT=y
#CONFIG_INPUT_ENCODER=y

#LVGL widgets
CONFIG_LV_USE_LABEL=y
#CONFIG_LV_USE_BTN=y
#CONFIG_LV_USE_IMG=y
#CONFIG_LV_USE_BAR=y


# Uncomment these as you need them:
# CONFIG_I2C=y
